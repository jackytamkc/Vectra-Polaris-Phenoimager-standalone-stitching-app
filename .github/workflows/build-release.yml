name: Build and release binaries

# Triggered by pushing a version tag (e.g. v1.2.0). Builds the app on
# Windows, Linux, and macOS runners in parallel and uploads each binary
# as an asset on the corresponding GitHub Release.
#
# Workflow is also manually triggerable from the Actions tab for testing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # needed to create releases and upload assets

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            spec_dir: linux
            artifact_name: YourFavouriteStitcher-linux
            binary_path: linux/dist/YourFavouriteStitcher
          - os: windows-latest
            spec_dir: Windows
            artifact_name: YourFavouriteStitcher-windows.exe
            binary_path: Windows/dist/YourFavouriteStitcher.exe
          - os: macos-latest
            spec_dir: Mac
            artifact_name: YourFavouriteStitcher-macos.zip
            binary_path: Mac/dist/YourFavouriteStitcher.app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        shell: bash
        run: |
          cd ${{ matrix.spec_dir }}
          pyinstaller YourFavouriteStitcher.spec

      - name: Package macOS .app as zip
        if: matrix.os == 'macos-latest'
        run: |
          cd Mac/dist
          # Zip the .app bundle so macOS preserves symlinks and metadata.
          # Using ditto (not zip) is important for .app integrity.
          ditto -c -k --sequesterRsrc --keepParent YourFavouriteStitcher.app YourFavouriteStitcher-macos.zip

      - name: Rename artifact for upload (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x linux/dist/YourFavouriteStitcher
          cp linux/dist/YourFavouriteStitcher linux/dist/YourFavouriteStitcher-linux

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.os == 'ubuntu-latest'  && 'linux/dist/YourFavouriteStitcher-linux'  || '' }}
            ${{ matrix.os == 'windows-latest' && 'Windows/dist/YourFavouriteStitcher.exe'  || '' }}
            ${{ matrix.os == 'macos-latest'   && 'Mac/dist/YourFavouriteStitcher-macos.zip' || '' }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: List downloaded artifacts
        run: find dist-artifacts -type f

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-artifacts/YourFavouriteStitcher-linux/YourFavouriteStitcher-linux
            dist-artifacts/YourFavouriteStitcher-windows.exe/YourFavouriteStitcher.exe
            dist-artifacts/YourFavouriteStitcher-macos.zip/YourFavouriteStitcher-macos.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
